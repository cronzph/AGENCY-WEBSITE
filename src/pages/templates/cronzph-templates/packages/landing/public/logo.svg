<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring - cyan -->
  <circle cx="100" cy="100" r="96" fill="#00d4ff" />
  <!-- Dark blue ring -->
  <circle cx="100" cy="100" r="88" fill="#0a3d7a" />
  <!-- Inner gradient circle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9ece;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b8d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="70" fill="url(#bgGrad)" />
  <!-- Circuit tree trunk -->
  <line x1="100" y1="150" x2="100" y2="80" stroke="url(#circuitGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Left branches -->
  <line x1="100" y1="110" x2="75" y2="85" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="85" x2="75" y2="65" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="95" x2="65" y2="70" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="100" x2="60" y2="90" stroke="url(#circuitGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right branches -->
  <line x1="100" y1="110" x2="125" y2="85" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="85" x2="125" y2="65" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="95" x2="135" y2="70" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="100" x2="140" y2="90" stroke="url(#circuitGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top branches -->
  <line x1="100" y1="80" x2="90" y2="55" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="110" y2="55" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Circuit nodes -->
  <circle cx="75" cy="65" r="3.5" fill="#00e5ff"/>
  <circle cx="65" cy="70" r="3" fill="#00e5ff"/>
  <circle cx="60" cy="90" r="2.5" fill="#00e5ff"/>
  <circle cx="125" cy="65" r="3.5" fill="#00e5ff"/>
  <circle cx="135" cy="70" r="3" fill="#00e5ff"/>
  <circle cx="140" cy="90" r="2.5" fill="#00e5ff"/>
  <circle cx="90" cy="55" r="3" fill="#00e5ff"/>
  <circle cx="110" cy="55" r="3" fill="#00e5ff"/>
  <!-- Lightbulb base -->
  <rect x="90" y="152" width="20" height="4" rx="2" fill="#00e5ff" opacity="0.9"/>
  <rect x="92" y="158" width="16" height="3" rx="1.5" fill="#00e5ff" opacity="0.7"/>
  <rect x="94" y="163" width="12" height="3" rx="1.5" fill="#00e5ff" opacity="0.5"/>
  <!-- Side dots -->
  <circle cx="30" cy="100" r="6" fill="white"/>
  <circle cx="170" cy="100" r="6" fill="white"/>
</svg>
